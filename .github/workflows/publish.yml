name: Publish to Maven Central

# Triggered manually or automatically when you push a version tag like v0.1.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 1. Java + Maven cache
      # ------------------------------------------------------------------ #
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          # Writes MAVEN_USERNAME / MAVEN_PASSWORD into ~/.m2/settings.xml
          # from the secrets below (server id must match publishingServerId = "central")
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          # GPG key for artifact signing
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # ------------------------------------------------------------------ #
      # 2. Resolve version
      #    - If triggered by tag push (v0.1.0)  → strip the "v" prefix
      #    - If triggered manually              → use the input
      # ------------------------------------------------------------------ #
      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      # ------------------------------------------------------------------ #
      # 3. Set version in all POMs
      # ------------------------------------------------------------------ #
      - name: Set release version
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false

      # ------------------------------------------------------------------ #
      # 4. Build, test, sign and upload to Sonatype Central
      # ------------------------------------------------------------------ #
      - name: Deploy to Maven Central
        run: mvn -B deploy -Prelease -pl '!atak-sample' --no-transfer-progress
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # ------------------------------------------------------------------ #
      # 5. Create GitHub Release
      # ------------------------------------------------------------------ #
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: ATAK ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
